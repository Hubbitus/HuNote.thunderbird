# Dovecot 2.4 config for HuNote e2e Gmail-mimicry backend.
# See docs/adr/0001-gmail-mimicry-dovecot-imapsieve.md for rationale.
# INSECURE — testing only. Cleartext auth, no TLS, single hardcoded user.

dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols {
  imap = yes
  sieve = yes
}

listen = *, ::

# Rootless podman can't bind privileged ports. Override the imap-login service
# port. External access is via `-p 4243:1143` on `podman run`.
service imap-login {
  inet_listener imap {
    port = 1143
  }
}

default_internal_user = vmail
default_login_user = vmail
default_internal_group = vmail

mail_home = /srv/mail/%{user}
mail_driver = sdbox
mail_path = ~/mail
mail_uid = vmail
mail_gid = vmail

namespace inbox {
  inbox = yes
  separator = /
  # SPECIAL-USE for [Gmail]/All Mail so TB shows it as an "All Mail" folder.
  mailbox "[Gmail]/All Mail" {
    auto = subscribe
    special_use = \All
  }
}

ssl = no
auth_allow_cleartext = yes
auth_default_domain = greenmail.local
auth_verbose = yes
auth_debug = yes
log_debug = category=mail
log_path = /dev/stderr
info_log_path = /dev/stderr
debug_log_path = /dev/stderr

userdb passwd-file {
  driver = passwd-file
  auth_username_format = %{user|lower}
  passwd_file_path = /etc/dovecot/users.db
}

passdb passwd-file {
  driver = passwd-file
  auth_username_format = %{user|lower}
  passwd_file_path = /etc/dovecot/users.db
}

# --- Sieve / imapsieve (Dovecot 2.4 top-level syntax) -------------------
# imapsieve fires the Sieve script on APPEND events into INBOX.
# fileinto :copy duplicates message into [Gmail]/All Mail, reproducing Gmail's
# label-folder dup-copy semantics locally.

sieve_extensions {
  copy = yes
  fileinto = yes
  imapsieve = yes
  vnd.dovecot.imapsieve = yes
}

sieve_plugins {
  sieve_imapsieve = yes
}

protocol imap {
  mail_plugins {
    imap_sieve = yes
  }
}

# Fire gmail-dup.sieve BEFORE any user script on APPEND into INBOX. COPY between
# mailboxes is a user action — not something to auto-dup. We specifically want
# APPEND-into-INBOX to mirror Gmail's delivery-time behavior.
mailbox INBOX {
  sieve_script gmail-dup {
    type = before
    cause = append
    path = /var/sieve/gmail-dup.sieve
  }
}

# Personal user script storage (Sieve requires this to exist for imapsieve context).
sieve_script personal {
  type = personal
  driver = file
  path = ~/sieve
  active_path = ~/.dovecot.sieve
}

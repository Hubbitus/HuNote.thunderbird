services:
  imap:
    image: docker.io/dovecot/dovecot:latest
    container_name: hunote-e2e-dovecot
    ports:
      - "1144:1143"
    volumes:
      - ../tests/e2e/dovecot:/etc/dovecot:ro
    healthcheck:
      test: ["CMD", "sh", "-c", "r=$$(printf 'a1 LOGOUT\\r\\n' | nc -w2 127.0.0.1 1143); case \"$$r\" in *OK*) exit 0;; esac; exit 1"]
      interval: 3s
      timeout: 4s
      retries: 20
      start_period: 5s

  tb:
    build:
      context: ..
      dockerfile: docker/e2e.Dockerfile
      args:
        TB_VERSION: ${TB_VERSION:-140.14.0esr}
    depends_on:
      imap:
        condition: service_healthy
    environment:
      HUNOTE_BACKEND: dovecot
      HUNOTE_IMAP_HOST: imap
      HUNOTE_GM_IMAP: "1143"
      HUNOTE_IMAP_USER: user@greenmail.local
      HUNOTE_IMAP_PASS: any
    volumes:
      - ../:/hunote
    working_dir: /hunote
